<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Битва школ Крыма</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#07140f;color:#fff}main{max-width:650px;margin:auto;padding:24px 16px}h1{text-align:center;color:#55e68a}.sub{text-align:center;color:#9bb3a5;margin-bottom:24px}.card{background:#10231b;border:1px solid #214b38;border-radius:18px;padding:18px;margin-bottom:16px}select,button{width:100%;padding:15px;border:0;border-radius:14px;font-size:16px}select{background:#173428;color:#fff;margin-bottom:14px}button{background:#39d978;font-weight:bold}.score{text-align:center;font-size:42px;color:#55e68a;font-weight:bold}.small{text-align:center;color:#9bb3a5}.row{display:flex;gap:8px;align-items:center;margin:12px 0}.name{width:145px;font-size:13px}.bar{flex:1;height:13px;background:#18362a;border-radius:20px;overflow:hidden}.fill{height:100%;background:#39d978}.num{width:45px;text-align:right}</style></head><body><main><h1>Битва школ Крыма</h1><div class="sub">Кликай за свою школу и поднимай её в рейтинге!</div><div class="card"><select id="school"></select><div class="score" id="score">0</div><div class="small">твоих кликов</div><br><button id="click">КЛИКНУТЬ ЗА ШКОЛУ</button></div><div class="card"><h2>🏆 Рейтинг школ</h2><div id="ranking"></div></div></main><script>const schools=["Школа №1 — Евпатория","Школа №2 — Евпатория","Школа №13 — Симферополь","Школа №18 — Симферополь","Школа №3 — Ялта","Школа №4 — Севастополь","Школа №5 — Керчь","Школа №6 — Феодосия","Школа №7 — Бахчисарай","Школа №8 — Саки"];let scores=JSON.parse(localStorage.getItem("scores")||"{}");schools.forEach(s=>scores[s]??=0);const sel=document.getElementById("school");schools.forEach(s=>sel.add(new Option(s,s)));function render(){document.getElementById("score").textContent=scores[sel.value];let a=[...schools].sort((x,y)=>scores[y]-scores[x]),m=Math.max(1,...a.map(s=>scores[s]));document.getElementById("ranking").innerHTML=a.map((s,i)=>'<div class="row"><div class="name">'+(i+1)+". "+s+'</div><div class="bar"><div class="fill" style="width:'+scores[s]/m*100+'%"></div></div><div class="num">'+scores[s]+'</div></div>').join("")}sel.onchange=render;document.getElementById("click").onclick=()=>{scores[sel.value]++;localStorage.setItem("scores",JSON.stringify(scores));render()};render();</script></body></html>
